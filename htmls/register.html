<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - UCC Shuttle Tracker</title>
    <link rel="stylesheet" href="../css/premium.css">
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <script src="../js/verify-code.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => window.lucide && lucide.createIcons());</script>
</head>
<body class="auth-shell">
    <section class="auth-brand">
        <div class="auth-slides" aria-hidden="true">
            <img src="../images/ucc-brt-buses.jpg" alt="">
            <img src="../images/ghana-driver.jpg" alt="">
            <img src="../images/ghana-students.jpg" alt="">
        </div>
        <div class="auth-mark"><i data-lucide="bus"></i> UCC Shuttle</div>
        <div>
            <h2>Create your campus account.</h2>
            <p>Enter your email. We send a code, then you finish the account.</p>
        </div>
        <div></div>
    </section>
    <section class="auth-panel">
        <div class="login-container">
            <div class="logo">
                <h1>Create account</h1>
                <p>Students and drivers</p>
            </div>
            <div class="error" id="errorMsg"></div>
            <div class="notice" id="okMsg"></div>
            <div class="role-choice">
                <button type="button" class="active" data-role="student">Student</button>
                <button type="button" data-role="driver">Driver</button>
            </div>
            <form id="emailForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" required placeholder="you@email.com" autocomplete="email">
                </div>
                <button class="btn-login" id="sendBtn" type="submit">Send code</button>
            </form>
            <form id="accountForm" class="hidden-step">
                <p class="step-note" id="sentNote"></p>
                <div class="form-group">
                    <label>Code from your email</label>
                    <div id="codeBoxes"></div>
                </div>
                <button class="btn-login" id="checkCodeBtn" type="button">Continue</button>
                <button class="step-link" id="resendBtn" type="button">Send the code again</button>
                <div id="detailsStep" class="hidden-step">
                    <p class="step-note">Now set your password and finish the account.</p>
                    <div class="form-group">
                        <label for="name">Full name</label>
                        <input type="text" id="name" required placeholder="Your name" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" placeholder="+233 XX XXX XXXX" autocomplete="tel">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
                    </div>
                    <button class="btn-login" type="submit">Create account</button>
                </div>
                <button class="step-link" id="changeEmailBtn" type="button">Use a different email</button>
            </form>
            <div class="links">
                <a href="student-login.html">Already have an account?</a>
            </div>
        </div>
    </section>
    <script>
        const errorMsg = document.getElementById('errorMsg');
        const boxes = createCodeBoxes(document.getElementById('codeBoxes'));
        let codeChecked = '';
        let role = new URLSearchParams(location.search).get('role') === 'driver' ? 'driver' : 'student';
        document.querySelectorAll('.role-choice button').forEach((button) => {
            button.classList.toggle('active', button.getAttribute('data-role') === role);
            button.addEventListener('click', () => {
                role = button.getAttribute('data-role');
                document.querySelectorAll('.role-choice button').forEach((item) => item.classList.toggle('active', item === button));
            });
        });
        function showError(text) {
            document.getElementById('okMsg').style.display = 'none';
            errorMsg.textContent = text;
            errorMsg.style.display = 'block';
        }
        function openCodeStep(email) {
            document.getElementById('emailForm').classList.add('hidden-step');
            document.getElementById('accountForm').classList.remove('hidden-step');
            document.getElementById('sentNote').textContent = 'Enter the 6-digit code sent to ' + email + '. Check inbox and spam.';
            errorMsg.style.display = 'none';
            boxes.focus();
        }
        async function sendCode() {
            const email = document.getElementById('email').value.trim();
            const response = await fetch('/api/auth/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, purpose: 'signup' })
            });
            const data = await response.json();
            if (!data.success) throw new Error(data.message || 'Could not send the code');
            document.getElementById('sentNote').textContent = 'Enter the 6-digit code sent to ' + email + '. Check inbox and spam.';
        }
        document.getElementById('emailForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('sendBtn');
            const email = document.getElementById('email').value.trim();
            if (!email) return showError('Enter the email address you want the code sent to');
            button.disabled = true;
            button.textContent = 'Sending code...';
            openCodeStep(email);
            try {
                await sendCode();
            } catch (error) {
                const text = String(error && error.message || '');
                showError(/fetch|network|abort/i.test(text) || !text ? 'We could not reach the shuttle service. Check your internet and try again.' : text);
            }
            button.disabled = false;
            button.textContent = 'Send code';
        });
        document.getElementById('resendBtn').addEventListener('click', async () => {
            try {
                await sendCode();
                const ok = document.getElementById('okMsg');
                ok.textContent = 'A new code is on the way. Check inbox and spam.';
                ok.style.display = 'block';
                errorMsg.style.display = 'none';
            } catch (error) {
                const text = String(error && error.message || '');
                showError(/fetch|network|abort/i.test(text) || !text ? 'We could not reach the shuttle service. Check your internet and try again.' : text);
            }
        });
        document.getElementById('checkCodeBtn').addEventListener('click', async () => {
            const button = document.getElementById('checkCodeBtn');
            const email = document.getElementById('email').value.trim();
            const code = boxes.code();
            if (code.length !== 6) return showError('Enter all 6 digits from the email');
            if (codeChecked === code) {
                document.getElementById('detailsStep').classList.remove('hidden-step');
                return;
            }
            button.disabled = true;
            button.textContent = 'Checking the code...';
            try {
                const response = await fetch('/api/auth/check-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, purpose: 'signup' })
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.message || 'That code is not right');
                codeChecked = code;
                errorMsg.style.display = 'none';
                document.getElementById('detailsStep').classList.remove('hidden-step');
                document.getElementById('name').focus();
            } catch (error) {
                document.getElementById('detailsStep').classList.add('hidden-step');
                const text = String(error && error.message || '');
                showError(/fetch|network|abort/i.test(text) || !text ? 'We could not reach the shuttle service. Check your internet and try again.' : text);
            }
            button.disabled = false;
            button.textContent = 'Continue';
        });
        document.getElementById('changeEmailBtn').addEventListener('click', () => {
            codeChecked = '';
            document.getElementById('detailsStep').classList.add('hidden-step');
            document.getElementById('accountForm').classList.add('hidden-step');
            document.getElementById('emailForm').classList.remove('hidden-step');
            document.getElementById('email').focus();
        });
        document.getElementById('accountForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('confirmPassword').value) return showError('Passwords do not match');
            if (boxes.code().length !== 6) return showError('Enter all 6 digits');
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    password,
                    role,
                    code: boxes.code()
                })
            });
            const data = await response.json();
            if (!data.success) return showError(data.message || 'Could not create the account');
            const ok = document.getElementById('okMsg');
            ok.textContent = 'Account created. Taking you to sign in.';
            ok.style.display = 'block';
            setTimeout(() => { window.location.href = role + '-login.html'; }, 1200);
        });
    </script>
</body>
</html>
