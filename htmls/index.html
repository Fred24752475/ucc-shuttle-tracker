<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCC Shuttle Tracker</title>
    <link rel="stylesheet" href="../css/premium.css">
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => window.lucide && lucide.createIcons());</script>
</head>
<body class="auth-shell">
    <section class="auth-brand">
        <div class="auth-slides" aria-hidden="true">
            <img src="../images/ucc-brt-buses.jpg" alt="">
            <img src="../images/ghana-driver.jpg" alt="">
            <img src="../images/ghana-students.jpg" alt="">
        </div>
        <div class="auth-mark"><i data-lucide="bus"></i> UCC Shuttle</div>
        <div>
            <h2>Campus rides, without the guesswork.</h2>
            <p>See the shuttle move, book a seat, and get where you need to be.</p>
        </div>
    </section>
    <section class="auth-panel">
        <div class="login-container">
            <div class="logo">
                <h1>Sign in</h1>
                <p>UCC Shuttle Tracker</p>
            </div>
            <div class="role-links">
                <a href="student-login.html"><i data-lucide="graduation-cap"></i> Student</a>
                <a href="driver-login.html"><i data-lucide="bus"></i> Driver</a>
                <a href="admin-login.html"><i data-lucide="shield"></i> Admin</a>
            </div>
            <div class="links">
                <a href="forgot-password.html">Forgot Password?</a>
            </div>
        </div>
    </section>
</body>
</html>
