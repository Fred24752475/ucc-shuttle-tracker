<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - UCC Shuttle Tracker</title>
    <link rel="stylesheet" href="../css/premium.css">
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <script src="../js/verify-code.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => window.lucide && lucide.createIcons());</script>
</head>
<body class="auth-shell">
    <section class="auth-brand">
        <div class="auth-slides" aria-hidden="true">
            <img src="../images/ucc-brt-buses.jpg" alt="">
            <img src="../images/ghana-driver.jpg" alt="">
            <img src="../images/ghana-students.jpg" alt="">
        </div>
        <div class="auth-mark"><i data-lucide="bus"></i> UCC Shuttle</div>
        <div>
            <h2>Get back into your account.</h2>
            <p>We email a 6-digit code. Enter it here and choose a new password.</p>
        </div>
        <div></div>
    </section>
    <section class="auth-panel">
        <div class="login-container">
            <div class="logo">
                <h1>Reset password</h1>
                <p>Students and drivers</p>
            </div>
            <div class="error" id="errorMsg"></div>
            <div class="notice" id="okMsg"></div>
            <form id="emailForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" required placeholder="you@email.com" autocomplete="email">
                </div>
                <button class="btn-login" id="sendBtn" type="submit">Send code</button>
            </form>
            <form id="resetForm" class="hidden-step">
                <p class="step-note" id="sentNote"></p>
                <div class="form-group">
                    <label>Code from your email</label>
                    <div id="codeBoxes"></div>
                </div>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" required minlength="6" placeholder="Repeat the password" autocomplete="new-password">
                </div>
                <button class="btn-login" type="submit">Update password</button>
                <button class="btn-login" id="resendBtn" type="button" style="background:#eef1f4;color:#1c1c1c">Send a new code</button>
            </form>
            <div class="links">
                <a href="student-login.html">Student login</a>
                <span>|</span>
                <a href="driver-login.html">Driver login</a>
            </div>
        </div>
    </section>
    <script>
        const boxes = createCodeBoxes(document.getElementById('codeBoxes'));
        const errorMsg = document.getElementById('errorMsg');
        const okMsg = document.getElementById('okMsg');
        let email = '';

        function showError(text) {
            okMsg.style.display = 'none';
            errorMsg.textContent = text;
            errorMsg.style.display = 'block';
        }

        async function sendCode() {
            email = document.getElementById('email').value.trim();
            const response = await fetch('/api/auth/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, purpose: 'reset' })
            });
            const data = await response.json();
            if (!data.success) throw new Error(data.message || 'Could not send the code');
            document.getElementById('emailForm').classList.add('hidden-step');
            document.getElementById('resetForm').classList.remove('hidden-step');
            document.getElementById('sentNote').textContent = 'Enter the code sent to ' + email;
            errorMsg.style.display = 'none';
            boxes.focus();
        }

        document.getElementById('emailForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('sendBtn');
            button.disabled = true;
            try { await sendCode(); }
            catch (error) {
                const text = String(error && error.message || '');
                showError(/fetch|network|abort/i.test(text) || !text ? 'We could not reach the shuttle service. Check your internet and try again.' : text);
            }
            button.disabled = false;
        });
        document.getElementById('resendBtn').addEventListener('click', async () => {
            try { await sendCode(); okMsg.textContent = 'A new code is on the way.'; okMsg.style.display = 'block'; }
            catch (error) {
                const text = String(error && error.message || '');
                showError(/fetch|network|abort/i.test(text) || !text ? 'We could not reach the shuttle service. Check your internet and try again.' : text);
            }
        });
        document.getElementById('resetForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            if (newPassword !== document.getElementById('confirmPassword').value) return showError('Passwords do not match');
            if (boxes.code().length !== 6) return showError('Enter all 6 digits');
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, resetCode: boxes.code(), newPassword })
            });
            const data = await response.json();
            if (!data.success) return showError(data.message || 'That code did not work');
            okMsg.textContent = 'Password updated. Taking you to sign in.';
            okMsg.style.display = 'block';
            errorMsg.style.display = 'none';
            setTimeout(() => { window.location.href = 'student-login.html'; }, 1200);
        });
    </script>
</body>
</html>
