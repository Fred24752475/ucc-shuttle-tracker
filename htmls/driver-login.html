<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login - UCC Shuttle Tracker</title>
    <link rel="stylesheet" href="../css/premium.css">
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <script>
        const API_CONFIG = { API_URL: '' };
        document.addEventListener('DOMContentLoaded', () => window.lucide && lucide.createIcons());
    </script>
</head>
<body class="auth-shell">
    <section class="auth-brand">
        <div class="auth-mark"><i data-lucide="bus"></i> UCC Shuttle</div>
        <div>
            <h2>Drive the campus. Students follow live.</h2>
            <p>Start a route and the shuttle moves on every map.</p>
        </div>
        <div></div>
    </section>
    <section class="auth-panel">
    <div class="login-container">
        <div class="logo">
            <h1>Driver sign in</h1>
            <p>UCC Shuttle Tracker</p>
        </div>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="driver@ucc.edu.gh">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <div class="links">
            <a href="/index.html">← Back to Home</a>
            <span>|</span>
            <a href="register.html">Create Account</a>
            <span>|</span>
            <a href="forgot-password.html">Forgot Password?</a>
        </div>
    </div>
    </section>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch(`${API_CONFIG.API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                console.log('Login response:', data);

                if (data.success) {
                    // Check if user is a driver
                    if (data.user.role !== 'driver') {
                        errorMsg.textContent = 'Access denied. This login is for drivers only. Please use the correct login page for your role.';
                        errorMsg.style.display = 'block';
                        return;
                    }
                    
                    localStorage.setItem('ucc_token', data.token);
                    localStorage.setItem('ucc_user', JSON.stringify(data.user));
                    window.location.href = 'driver-dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Login failed';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
