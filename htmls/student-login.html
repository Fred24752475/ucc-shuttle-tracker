<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - UCC Shuttle Tracker</title>
    <link rel="stylesheet" href="../css/premium.css">
    <script src="../js/verify-code.js"></script>
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <script>
        const API_CONFIG = { API_URL: '' };
        document.addEventListener('DOMContentLoaded', () => window.lucide && lucide.createIcons());
    </script>
</head>
<body class="auth-shell">
    <section class="auth-brand">
        <div class="auth-slides" aria-hidden="true">
            <img src="../images/ucc-brt-buses.jpg" alt="">
            <img src="../images/ghana-driver.jpg" alt="">
            <img src="../images/ghana-students.jpg" alt="">
        </div>
        <div class="auth-mark"><i data-lucide="bus"></i> UCC Shuttle</div>
        <div>
            <h2>Campus rides, without the guesswork.</h2>
            <p>See the shuttle move, book a seat, and get where you need to be.</p>
        </div>
        <div></div>
    </section>
    <section class="auth-panel">
    <div class="login-container">
        <div class="logo">
            <h1>Student sign in</h1>
            <p>UCC Shuttle Tracker</p>
        </div>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="student@ucc.edu.gh">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <div class="links">
            <a href="/index.html">← Back to Home</a>
            <span>|</span>
            <a href="register.html">Create Account</a>
            <span>|</span>
            <a href="forgot-password.html">Forgot Password?</a>
        </div>
    </div>
    </section>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const button = e.target.querySelector('button');
            setBusy(button, true, 'Signing in...');
            errorMsg.style.display = 'none';

            try {
                const response = await fetch(`${API_CONFIG.API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success && data.user.role === 'student') {
                    localStorage.setItem('ucc_token', data.token);
                    localStorage.setItem('ucc_user', JSON.stringify(data.user));
                    errorMsg.className = 'notice';
                    errorMsg.textContent = 'You are signed in.';
                    errorMsg.style.display = 'block';
                    setTimeout(() => { window.location.href = 'student-dashboard.html'; }, 700);
                    return;
                }

                errorMsg.className = 'error';
                errorMsg.textContent = data.success
                    ? 'This page is for students. Use the driver or admin sign in.'
                    : 'That email or password is not right. Try again, or reset your password.';
                errorMsg.style.display = 'block';
                setBusy(button, false);
            } catch (error) {
                errorMsg.className = 'error';
                errorMsg.textContent = 'We could not reach the shuttle service. Check your internet and try again.';
                errorMsg.style.display = 'block';
                setBusy(button, false);
            }
        });
    </script>
</body>
</html>
