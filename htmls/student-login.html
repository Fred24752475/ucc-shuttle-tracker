<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - UCC Shuttle Tracker</title>
    <link rel="stylesheet" href="../css/premium.css">
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <script>
        const API_CONFIG = { API_URL: '' };
        document.addEventListener('DOMContentLoaded', () => window.lucide && lucide.createIcons());
    </script>
</head>
<body class="auth-shell">
    <section class="auth-brand">
        <div class="auth-slides" aria-hidden="true">
            <img src="../images/ucc-brt-buses.jpg" alt="">
            <img src="../images/ghana-driver.jpg" alt="">
            <img src="../images/ghana-students.jpg" alt="">
        </div>
        <div class="auth-mark"><i data-lucide="bus"></i> UCC Shuttle</div>
        <div>
            <h2>Campus rides, without the guesswork.</h2>
            <p>See the shuttle move, book a seat, and get where you need to be.</p>
        </div>
        <div></div>
    </section>
    <section class="auth-panel">
    <div class="login-container">
        <div class="logo">
            <h1>Student sign in</h1>
            <p>UCC Shuttle Tracker</p>
        </div>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="student@ucc.edu.gh">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <div class="links">
            <a href="/index.html">← Back to Home</a>
            <span>|</span>
            <a href="register.html">Create Account</a>
            <span>|</span>
            <a href="forgot-password.html">Forgot Password?</a>
        </div>
    </div>
    </section>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // Show attempting login
            errorMsg.textContent = 'Connecting to server...';
            errorMsg.style.background = '#ffc';
            errorMsg.style.color = '#333';
            errorMsg.style.display = 'block';

            try {
                console.log('Attempting login to:', `${API_CONFIG.API_URL}/api/login`);
                
                // Add timeout to fetch
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
                
                const response = await fetch(`${API_CONFIG.API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Login response:', data);

                if (data.success) {
                    // Check if user is a student
                    if (data.user.role !== 'student') {
                        errorMsg.textContent = 'Access denied. This login is for students only.';
                        errorMsg.style.background = '#fee';
                        errorMsg.style.color = '#c33';
                        return;
                    }
                    
                    errorMsg.textContent = 'Login successful! Redirecting...';
                    errorMsg.style.background = '#efe';
                    errorMsg.style.color = '#060';
                    
                    localStorage.setItem('ucc_token', data.token);
                    localStorage.setItem('ucc_user', JSON.stringify(data.user));
                    
                    setTimeout(() => {
                        window.location.href = 'student-dashboard.html';
                    }, 500);
                } else {
                    errorMsg.textContent = data.message || 'Login failed';
                    errorMsg.style.background = '#fee';
                    errorMsg.style.color = '#c33';
                }
            } catch (error) {
                console.error('Login error:', error);
                if (error.name === 'AbortError') {
                    errorMsg.textContent = 'Connection timeout. Server took too long to respond.';
                } else {
                    errorMsg.textContent = 'Error: ' + error.message;
                }
                errorMsg.style.background = '#fee';
                errorMsg.style.color = '#c33';
            }
        });
    </script>
</body>
</html>
